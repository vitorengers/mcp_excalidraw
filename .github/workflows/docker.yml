name: Docker Build & Push

# A pull request proves the images build; it never publishes one. A fork's GITHUB_TOKEN is
# read-only whatever the permissions block below asks for, so a pull request that pushes leaves
# an outside contributor with red jobs they cannot fix — and a pull request from a branch in this
# repository would publish an unreviewed pr-N tag to a public registry on every push instead.
# Publishing happens on main and on a version tag, and nowhere else.

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_MCP: ${{ github.repository }}
  IMAGE_NAME_CANVAS: ${{ github.repository }}-canvas
  # The tags the build job loads into the local daemon and the test job reads back. Local names:
  # nothing here reaches a registry.
  LOCAL_TAG_MCP: mcp-excalidraw:ci
  LOCAL_TAG_CANVAS: mcp-excalidraw-canvas:ci

jobs:
  build-and-push-mcp:
    name: Build and Push MCP Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Used by the push step only, which a pull request never reaches.
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for MCP Server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MCP }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Single platform, because `load` writes into the local Docker daemon and the daemon holds
      # one image per tag, not a manifest list.
      - name: Build MCP Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG_MCP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Save MCP Server image for the test job
        run: docker save --output /tmp/mcp.tar ${{ env.LOCAL_TAG_MCP }}

      - name: Upload MCP Server image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-mcp
          path: /tmp/mcp.tar
          retention-days: 1

      # The amd64 half is already in the cache above, so this builds arm64 and pushes both.
      - name: Push MCP Server image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-and-push-canvas:
    name: Build and Push Canvas Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Used by the push step only, which a pull request never reaches.
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Canvas Server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CANVAS }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Canvas Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.canvas
          push: false
          load: true
          tags: ${{ env.LOCAL_TAG_CANVAS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Save Canvas Server image for the test job
        run: docker save --output /tmp/canvas.tar ${{ env.LOCAL_TAG_CANVAS }}

      - name: Upload Canvas Server image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-canvas
          path: /tmp/canvas.tar
          retention-days: 1

      - name: Push Canvas Server image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.canvas
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  test-docker-images:
    name: Test Docker Images
    needs: [build-and-push-mcp, build-and-push-canvas]
    runs-on: ubuntu-latest

    steps:
      - name: Download MCP Server image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-mcp
          path: /tmp

      - name: Download Canvas Server image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-canvas
          path: /tmp

      - name: Load both images
        run: |
          docker load --input /tmp/mcp.tar
          docker load --input /tmp/canvas.tar

      # The container still listens on 3000 — that is what the image EXPOSEs — but the host port
      # is whatever the kernel hands out. A runner is a shared machine and this project has paid
      # for a fixed 3000 twice already; see docs/trap-port-3000.md.
      - name: Test Canvas Server image
        run: |
          docker run -d -p 127.0.0.1::3000 --name test-canvas ${{ env.LOCAL_TAG_CANVAS }}
          host_port="$(docker port test-canvas 3000/tcp | head -n 1 | sed 's/.*://')"
          echo "Canvas server published on host port ${host_port}"
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${host_port}/health"; then
              ready=1
              break
            fi
            sleep 2
          done
          echo
          docker logs test-canvas
          docker stop test-canvas
          test "${ready}" = "1" || exit 1

      - name: Test MCP Server image
        run: |
          docker image inspect ${{ env.LOCAL_TAG_MCP }} --format 'MCP Server image built: {{ .Id }}'
