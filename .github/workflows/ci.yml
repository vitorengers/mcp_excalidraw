name: CI

# Three jobs, one per tier that a hosted runner can satisfy. `scripts/run-checks.mjs` is what
# selects the checks — see docs/running.md, "Which checks run where" — and this file only says
# which machine each tier gets and what has to be true before the runner is invoked.
#
# The `windows` and `wsl` tiers are deliberately absent: one needs a real distro behind
# `wsl.exe`, which no hosted image has, and the other is the maintainer's own box. Both report
# EXPECTED-SKIP wherever they are asked for, so adding them would buy a line of output.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Nothing here publishes anything, and nothing reads a secret, so a pull request from a fork
# completes all three jobs exactly as a branch in this repository does.
permissions:
  contents: read

# A second push to the same branch replaces the run it made obsolete rather than queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    # `fail-fast: false` throughout: the point of the matrix is to find out which platforms are
    # red, and cancelling the others the moment one fails answers that for exactly one of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20 and 22, and `package.json`'s `engines.node` says the same. It claimed `>=18` and
        # this matrix carried one ubuntu job at 18 to find out whether that held; 18 reached end
        # of life in April 2025, so the answer worth buying was the floor rather than the
        # evidence. `check-ci-workflow.mjs` fails if the two disagree again.
        node: ['20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

      # `run-checks.mjs` refuses to run against a missing dist/ and will not build one itself,
      # so this step is what the whole job rests on rather than a convenience.
      - name: Build project
        run: npm run build

      - name: Run the fast tier
        run: node scripts/run-checks.mjs --tier fast

  browser:
    name: browser / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # Installed rather than assumed. An image that ships a browser today may not tomorrow,
      # and a browser tier running against whatever happens to be on the machine is a tier
      # whose result nobody can reproduce.
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # `--strict` is the half that matters: without it a check that found no browser exits 3
      # and is reported as a skip, which is how sixty-nine checks hide behind a green tick.
      - name: Run the browser tier
        run: node scripts/run-checks.mjs --tier browser --strict
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  repo:
    name: repo / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      # The full history, because these five ask what this fork has merged and a shallow clone
      # cannot answer.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Ubuntu alone, and once. These read tracked files and this repository's own board, so a
      # second platform would be a second chance to disagree about a file rather than a second
      # measurement.
      - name: Run the repo tier
        run: node scripts/run-checks.mjs --tier repo
